name: System One experiment

on:
  pull_request:
    paths:
      - 'experiments/system_one_jev_distill/**'
      - '.github/workflows/system-one-experiment.yml'
      - '.gitignore'
  push:
    branches: [experiment/system-one-distill]

permissions:
  contents: read

jobs:
  python-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install experiment dependencies
        run: python3 -m pip install --upgrade numpy typesafe-sdk
      - name: Compile Python files
        run: python3 -m py_compile experiments/system_one_jev_distill/*.py
      - name: Validate collector failure handling offline
        run: python3 -m unittest discover -s experiments/system_one_jev_distill -p 'test_*.py'
      - name: Validate dispatcher selection and worker boundaries offline
        run: |
          python3 -m compileall -q experiments/system_one_jev_distill/dispatcher
          python3 -m unittest discover -s experiments/system_one_jev_distill/dispatcher -p 'test_*.py'
      - name: Verify TypeSafe SDK surface used by collector
        run: |
          python3 - <<'PY'
          from typesafe_sdk import Noul, TypeSafeClient
          q = Noul(instructions='Is this a smoke test?')
          assert q.instructions == 'Is this a smoke test?'
          assert TypeSafeClient is not None
          print('typesafe-sdk import and Noul construction: PASS')
          PY
      - name: Generate deterministic states
        run: |
          python3 experiments/system_one_jev_distill/generate_states.py /tmp/states.jsonl --count 96 --seed 7
          test "$(wc -l < /tmp/states.jsonl)" -eq 96
      - name: Build deterministic mock teacher labels
        run: |
          python3 - <<'PY'
          import json, math
          source = '/tmp/states.jsonl'
          target = '/tmp/mock_teacher.jsonl'
          with open(source, 'r', encoding='utf-8') as src, open(target, 'w', encoding='utf-8') as out:
              for line in src:
                  row = json.loads(line)
                  x = row['x8']
                  ys = []
                  for i in range(8):
                      z = 0.35 * (i - 3.5)
                      for j, value in enumerate(x):
                          z += value * (((i + 1) * (j + 3)) % 7 - 3) * 0.22
                      ys.append(1.0 / (1.0 + math.exp(-z)))
                  out.write(json.dumps({'x8': x, 'targets': ys}) + '\n')
          PY
      - name: Distill mock teacher into V2-compatible rows
        run: python3 experiments/system_one_jev_distill/distill_system_one.py --teacher-jsonl /tmp/mock_teacher.jsonl --seed 7 --out /tmp/distilled
      - name: Validate distilled artifacts
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          rows = json.loads(Path('/tmp/distilled/ssos_head_rows.json').read_text())['rows']
          report = json.loads(Path('/tmp/distilled/report.json').read_text())
          assert len(rows) == 8 and all(len(row) == 9 for row in rows)
          assert report['weights'] == 72
          assert report['examples'] == 96
          assert 0.0 <= report['mean_threshold_agreement_q10'] <= 1.0
          assert 0.0 <= report['mean_mae_q10'] <= 1.0
          for row in rows:
              for value in row:
                  assert math.isfinite(value)
                  assert abs(value * 1024 - round(value * 1024)) < 1e-9
          print('distillation artifact validation: PASS')
          PY
      - name: Run synthetic smoke test
        run: |
          python3 experiments/system_one_jev_distill/distill_system_one.py --synthetic-examples 2000 --seed 42 --out /tmp/synthetic > /tmp/synthetic.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/synthetic/report.json').read_text())
          assert report['examples'] == 2000
          assert report['mean_threshold_agreement_q10'] >= 0.80
          assert report['max_probability_delta_float_vs_q10'] <= 0.005
          print('synthetic smoke gate: PASS')
          PY

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse Windows runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem 'experiments/system_one_jev_distill/*.ps1') {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          Write-Host 'PowerShell parse: PASS'
      - name: Verify encrypted credential handling without a real key
        shell: pwsh
        run: ./experiments/system_one_jev_distill/test_credentials_windows.ps1
      - name: Verify Tailscale capture and Windows stdin encryption offline
        shell: pwsh
        run: python -m unittest discover -s experiments/system_one_jev_distill -p 'test_capture_key_tailscale.py'
